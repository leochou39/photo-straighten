<title>我最正直</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&display=swap">
<style>
/* Layout: phone = one column (original → three candidates → fine-tune); desktop = sticky left rail (title, controls, original) beside a work area (candidates row, then large editor with sliders). Save bar pinned to the bottom edge. */
:root{
  --bg:#E4EFE0; --surface:#FFFFFF; --ink:#16201A; --muted:#55665A; --line:#C9DAC4;
  --accent:#1F5BD8; --accent-ink:#FFFFFF; --warm:#D9822B;
  --grid:rgba(255,255,255,.55); --grid-shadow:rgba(0,0,0,.25); --scrim:rgba(0,0,0,.6);
  --font-display:"Noto Serif TC","Songti TC",serif;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101812; --surface:#18221B; --ink:#E6EEE7; --muted:#97A99B; --line:#2A3A2E;
  --accent:#7099FF; --accent-ink:#0B1020; --warm:#F0A35A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101812; --surface:#18221B; --ink:#E6EEE7; --muted:#97A99B; --line:#2A3A2E;
  --accent:#7099FF; --accent-ink:#0B1020; --warm:#F0A35A; color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--font-body);font-size:15px;line-height:1.6}
.wrap{max-width:1360px;margin:0 auto;padding-block:28px 120px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:28px}
.side,.work{display:flex;flex-direction:column;gap:22px;min-width:0}
header{text-align:center}
h1{font-family:var(--font-display);font-size:32px;line-height:1.2;margin:0;text-wrap:balance;letter-spacing:.04em}
h2{font-size:16px;margin:0;font-weight:700}
.lede{margin:6px auto 0;color:var(--muted);max-width:40ch}
.toolbar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:center}
.btn{font:inherit;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  padding:10px 18px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.opt:focus-within,.switch input:focus-visible,input[type=range]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.switch{display:inline-flex;align-items:center;gap:6px;color:var(--muted);cursor:pointer;user-select:none}
.switch input{accent-color:var(--accent);width:18px;height:18px;margin:0}
.status{margin:0;min-height:1.6em;color:var(--muted);font-size:14px;text-align:center}
.status.busy::before{content:"";display:inline-block;width:10px;height:10px;margin-right:8px;border-radius:50%;
  border:2px solid var(--accent);border-right-color:transparent;animation:spin .8s linear infinite;vertical-align:-1px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.status.busy::before{animation:none}}
.sec-head{display:flex;align-items:baseline;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.tag{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 10px;
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.orig-body{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:flex-start}
.frame{position:relative;display:inline-block;max-width:100%;line-height:0;border-radius:6px;overflow:hidden;background:var(--line)}
.frame canvas{display:block;max-width:100%;height:auto}
#origCanvas{max-height:min(48vh,380px);width:auto}
.frame .overlay{position:absolute;inset:0;width:100%!important;height:100%!important;max-height:none!important;pointer-events:none}
.facts{margin:0;display:grid;grid-template-columns:auto auto;gap:4px 16px;font-size:14px;min-width:0}
.facts dt{color:var(--muted)}
.facts dd{margin:0;font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:16px;align-items:start}
.opt{position:relative;display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);
  border-radius:10px;padding:10px;cursor:pointer}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.opt .frame{display:block}
.opt canvas{width:100%}
.gridov{position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(to right,var(--grid) 1px,transparent 1px),linear-gradient(to bottom,var(--grid) 1px,transparent 1px);
  background-size:12.5% 12.5%;filter:drop-shadow(0 0 .5px var(--grid-shadow))}
.nogrid .gridov{display:none}
.opt-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.opt-name{font-weight:700}
.pick{font-size:12px;padding:2px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.opt.sel .pick{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt-desc{margin:0;color:var(--muted);font-size:14px}
.opt-info{margin:0;font-family:var(--font-mono);font-size:13px;font-variant-numeric:tabular-nums}
.empty{color:var(--muted);margin:0}
.editor{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:18px}
.ed-view{display:flex;justify-content:center;min-width:0}
.ed-view .frame canvas{max-height:min(70vh,760px);width:auto}
.sliders{display:flex;flex-direction:column;gap:14px;min-width:0}
.sl label{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.sl output{font-family:var(--font-mono);font-variant-numeric:tabular-nums;color:var(--muted)}
.sl input{width:100%;margin:6px 0 0;accent-color:var(--accent)}
.sl .ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.outsize{margin:0;font-size:14px;color:var(--muted);text-align:center}
.outsize b{font-family:var(--font-mono);font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
.ed-actions{display:flex;justify-content:center}
.savebar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.savebar-inner{max-width:1360px;margin:0 auto;padding-block:10px;display:flex;align-items:center;justify-content:center;gap:10px}
.sheet{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;z-index:10;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet[hidden]{display:none}
.sheet-card{background:var(--surface);border-radius:12px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:12px;max-width:min(720px,100%);max-height:100%}
.sheet-card p{margin:0;text-align:center}
.sheet-card img{min-height:0;object-fit:contain;max-height:70vh;border-radius:6px;-webkit-touch-callout:default}
@media (min-width:1000px){
  .wrap{display:grid;grid-template-columns:minmax(300px,360px) minmax(0,1fr);gap:40px;align-items:start}
  .side{position:sticky;top:calc(20px + env(safe-area-inset-top,0px))}
  .orig-body{flex-direction:column}
  #origCanvas{max-height:min(40vh,420px)}
  .options{grid-template-columns:repeat(3,minmax(0,1fr))}
  .editor{grid-template-columns:minmax(0,1fr) 280px;align-items:start}
}
</style>

<main class="wrap">
  <div class="side">
    <header>
      <h1>我最正直</h1>
      <p class="lede">上傳照片，自動偵測畫面裡的直線，產生三種拉直結果。</p>
    </header>

    <div class="toolbar">
      <label class="btn primary" for="file">選擇照片</label>
      <input id="file" type="file" accept="image/*" hidden>
      <label class="switch"><input type="checkbox" id="crop" checked> 自動裁切邊緣</label>
      <label class="switch"><input type="checkbox" id="grid" checked> 格線</label>
      <label class="switch"><input type="checkbox" id="lines" checked> 偵測線</label>
    </div>
    <p id="status" class="status" role="status"></p>

    <section>
      <div class="sec-head"><h2>原圖</h2><span id="srcName" class="tag">範例照片</span></div>
      <div class="orig-body">
        <div>
          <div class="frame"><canvas id="origCanvas"></canvas><canvas id="lineCanvas" class="overlay"></canvas></div>
          <div class="legend"><span><i style="background:var(--accent)"></i>垂直線</span><span><i style="background:var(--warm)"></i>水平線</span></div>
        </div>
        <dl class="facts" id="facts"></dl>
      </div>
    </section>
  </div>

  <div class="work">
    <section>
      <div class="sec-head"><h2>1. 選一個版本</h2></div>
      <div class="options" id="options"></div>
    </section>

    <section id="editorSec">
      <div class="sec-head"><h2>2. 微調</h2><span id="edName" class="tag"></span></div>
      <div class="editor">
        <div class="ed-view"><div class="frame"><canvas id="edCanvas"></canvas><div class="gridov"></div></div></div>
        <div class="sliders">
          <div class="sl"><label for="adjRot">旋轉 <output id="outRot">0.0°</output></label>
            <input type="range" id="adjRot" min="-10" max="10" step="0.1" value="0"><div class="ends"><span>逆時針</span><span>順時針</span></div></div>
          <div class="sl"><label for="adjVert">垂直透視 <output id="outVert">0.0°</output></label>
            <input type="range" id="adjVert" min="-25" max="25" step="0.5" value="0"><div class="ends"><span>上寬</span><span>上窄</span></div></div>
          <div class="sl"><label for="adjHorz">水平透視 <output id="outHorz">0.0°</output></label>
            <input type="range" id="adjHorz" min="-25" max="25" step="0.5" value="0"><div class="ends"><span>左寬</span><span>右寬</span></div></div>
          <div class="sl"><label for="adjAspect">長寬比 <output id="outAspect">0%</output></label>
            <input type="range" id="adjAspect" min="-30" max="30" step="1" value="0"><div class="ends"><span>變寬</span><span>變高</span></div></div>
          <p class="outsize">輸出尺寸 <b id="outSize">–</b></p>
          <div class="ed-actions"><button id="resetAdj" class="btn" type="button">重設微調</button></div>
        </div>
      </div>
    </section>
  </div>
</main>

<div class="savebar">
  <div class="savebar-inner"><button id="viewBtn" class="btn" type="button">看大圖</button><button id="saveBtn" class="btn primary" type="button">儲存到手機</button></div>
</div>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-card">
    <p>長按圖片，選「加入照片」或「儲存影像」。電腦上可按右鍵另存。</p>
    <img id="sheetImg" alt="拉直後的照片">
    <button id="sheetClose" class="btn" type="button">關閉</button>
  </div>
</div>

<script>
(() => {
const $ = id => document.getElementById(id);
const DEG = 180 / Math.PI;
const EX = [1, 0, 0], EY = [0, 1, 0];
const DEFAULT_F35 = 26;          // typical phone main camera, 35mm-equivalent
const ANALYZE_LONG = 1024;       // detection resolution
const PREVIEW_LONG = 900;        // option thumbnails
const MAX_AREA = 16e6;           // iOS Safari canvas limit

// ---------- small linear algebra ----------
const dot = (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2];
const cross = (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const norm = a => { const n = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0]/n, a[1]/n, a[2]/n]; };
const mul = (A, B) => A.map(r => [0,1,2].map(j => r[0]*B[0][j] + r[1]*B[1][j] + r[2]*B[2][j]));
const T = A => [[A[0][0],A[1][0],A[2][0]],[A[0][1],A[1][1],A[2][1]],[A[0][2],A[1][2],A[2][2]]];
const mv = (A, v) => [dot(A[0], v), dot(A[1], v), dot(A[2], v)];
const clamp1 = x => Math.max(-1, Math.min(1, x));
const I3 = [[1,0,0],[0,1,0],[0,0,1]];
const Rz = t => { const c = Math.cos(t), s = Math.sin(t); return [[c,-s,0],[s,c,0],[0,0,1]]; };
const Rx = t => { const c = Math.cos(t), s = Math.sin(t); return [[1,0,0],[0,c,-s],[0,s,c]]; };
const Ry = t => { const c = Math.cos(t), s = Math.sin(t); return [[c,0,s],[0,1,0],[-s,0,c]]; };
function axisAngle(k, t) {
  const c = Math.cos(t), s = Math.sin(t), C = 1 - c, [x, y, z] = k;
  return [[c+x*x*C, x*y*C-z*s, x*z*C+y*s], [y*x*C+z*s, c+y*y*C, y*z*C-x*s], [z*x*C-y*s, z*y*C+x*s, c+z*z*C]];
}
// rotation taking unit vector d onto t (optionally only part of the way)
function align(d, t, frac = 1) {
  const ax = cross(d, t), sn = Math.hypot(ax[0], ax[1], ax[2]);
  if (sn < 1e-9) return I3;
  return axisAngle(norm(ax), Math.acos(clamp1(dot(d, t))) * frac);
}
function minEigVec(M) {
  const a = M.map(r => r.slice()), V = [[1,0,0],[0,1,0],[0,0,1]];
  for (let sweep = 0; sweep < 60; sweep++) {
    if (a[0][1]**2 + a[0][2]**2 + a[1][2]**2 < 1e-20) break;
    for (const [p, q] of [[0,1],[0,2],[1,2]]) {
      if (Math.abs(a[p][q]) < 1e-16) continue;
      const th = (a[q][q] - a[p][p]) / (2 * a[p][q]);
      const t = (th >= 0 ? 1 : -1) / (Math.abs(th) + Math.sqrt(th*th + 1));
      const c = 1 / Math.sqrt(t*t + 1), s = t * c;
      for (let k = 0; k < 3; k++) { const x = a[k][p], y = a[k][q]; a[k][p] = c*x - s*y; a[k][q] = s*x + c*y; }
      for (let k = 0; k < 3; k++) { const x = a[p][k], y = a[q][k]; a[p][k] = c*x - s*y; a[q][k] = s*x + c*y; }
      for (let k = 0; k < 3; k++) { const x = V[k][p], y = V[k][q]; V[k][p] = c*x - s*y; V[k][q] = s*x + c*y; }
    }
  }
  let i = 0; for (let k = 1; k < 3; k++) if (a[k][k] < a[i][i]) i = k;
  return [V[0][i], V[1][i], V[2][i]];
}
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---------- EXIF: 35mm-equivalent focal length ----------
function exifFocal35(buf) {
  const v = new DataView(buf);
  if (v.byteLength < 4 || v.getUint16(0) !== 0xFFD8) return null;
  let o = 2;
  while (o < v.byteLength - 10) {
    const m = v.getUint16(o), len = v.getUint16(o + 2);
    if ((m & 0xFF00) !== 0xFF00) return null;
    if (m === 0xFFE1 && v.getUint32(o + 4) === 0x45786966) {
      const t = o + 10, le = v.getUint16(t) === 0x4949;
      const u16 = p => v.getUint16(p, le), u32 = p => v.getUint32(p, le);
      const ifd0 = t + u32(t + 4); let exif = 0;
      for (let i = 0, n = u16(ifd0); i < n; i++) { const e = ifd0 + 2 + i*12; if (u16(e) === 0x8769) exif = t + u32(e + 8); }
      if (!exif) return null;
      for (let i = 0, n = u16(exif); i < n; i++) { const e = exif + 2 + i*12; if (u16(e) === 0xA405) return u16(e + 8) || null; }
      return null;
    }
    o += 2 + len;
  }
  return null;
}

// ---------- line segment detection (region growing on gradient orientation) ----------
function detectSegments(img, w, h) {
  const n = w * h, d = img.data;
  let g = new Float32Array(n), tmp = new Float32Array(n);
  for (let i = 0, p = 0; i < n; i++, p += 4) g[i] = 0.299*d[p] + 0.587*d[p+1] + 0.114*d[p+2];
  const K = [1/16, 4/16, 6/16, 4/16, 1/16];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { let s = 0;
    for (let k = -2; k <= 2; k++) s += K[k+2] * g[y*w + Math.min(w-1, Math.max(0, x+k))]; tmp[y*w+x] = s; }
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { let s = 0;
    for (let k = -2; k <= 2; k++) s += K[k+2] * tmp[Math.min(h-1, Math.max(0, y+k))*w + x]; g[y*w+x] = s; }
  const mag = new Float32Array(n), ang = new Float32Array(n);
  for (let y = 1; y < h-1; y++) for (let x = 1; x < w-1; x++) {
    const i = y*w + x;
    const gx = (g[i-w+1] + 2*g[i+1] + g[i+w+1]) - (g[i-w-1] + 2*g[i-1] + g[i+w-1]);
    const gy = (g[i+w-1] + 2*g[i+w] + g[i+w+1]) - (g[i-w-1] + 2*g[i-w] + g[i-w+1]);
    mag[i] = Math.hypot(gx, gy); ang[i] = Math.atan2(gx, -gy);
  }
  const TH = 36, BINS = 1024, cnt = new Int32Array(BINS + 1);
  const bin = m => Math.min(BINS - 1, (m * 0.7) | 0);
  let total = 0;
  for (let i = 0; i < n; i++) if (mag[i] > TH) { cnt[bin(mag[i])]++; total++; }
  for (let b = BINS - 1, acc = 0; b >= 0; b--) { const c = cnt[b]; cnt[b] = acc; acc += c; }
  const order = new Int32Array(total);
  for (let i = 0; i < n; i++) if (mag[i] > TH) order[cnt[bin(mag[i])]++] = i;

  const used = new Uint8Array(n), reg = new Int32Array(n), tau = Math.PI / 8;
  const diag = Math.hypot(w, h), minLen = Math.max(18, 0.025 * diag), segs = [];
  for (let oi = 0; oi < total; oi++) {
    const seed = order[oi]; if (used[seed]) continue;
    let len = 0, head = 0, th = ang[seed], sx = Math.cos(th), sy = Math.sin(th);
    used[seed] = 1; reg[len++] = seed;
    while (head < len) {
      const p = reg[head++], px = p % w, py = (p / w) | 0;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        if (!dx && !dy) continue;
        const nx = px + dx, ny = py + dy; if (nx < 1 || ny < 1 || nx > w-2 || ny > h-2) continue;
        const q = ny*w + nx; if (used[q] || mag[q] <= TH) continue;
        let df = Math.abs(ang[q] - th); if (df > Math.PI) df = 2*Math.PI - df; if (df > tau) continue;
        used[q] = 1; reg[len++] = q; sx += Math.cos(ang[q]); sy += Math.sin(ang[q]); th = Math.atan2(sy, sx);
      }
    }
    if (len < 20) continue;
    let W = 0, cx = 0, cy = 0;
    for (let k = 0; k < len; k++) { const p = reg[k], m = mag[p]; W += m; cx += m*(p % w); cy += m*((p / w) | 0); }
    cx /= W; cy /= W;
    let sxx = 0, syy = 0, sxy = 0;
    for (let k = 0; k < len; k++) { const p = reg[k], m = mag[p], x = (p % w) - cx, y = ((p / w) | 0) - cy;
      sxx += m*x*x; syy += m*y*y; sxy += m*x*y; }
    const phi = 0.5 * Math.atan2(2*sxy, sxx - syy), c = Math.cos(phi), s = Math.sin(phi);
    let t0 = Infinity, t1 = -Infinity, e0 = Infinity, e1 = -Infinity;
    for (let k = 0; k < len; k++) { const p = reg[k], x = (p % w) - cx, y = ((p / w) | 0) - cy;
      const t = x*c + y*s, e = -x*s + y*c; if (t < t0) t0 = t; if (t > t1) t1 = t; if (e < e0) e0 = e; if (e > e1) e1 = e; }
    const L = t1 - t0, wd = e1 - e0 + 1;
    if (L < minLen || wd > Math.max(6, 0.12 * L)) continue;
    segs.push({ x1: cx + t0*c, y1: cy + t0*s, x2: cx + t1*c, y2: cy + t1*s, len: L });
  }

}

    const dl = await downloadsP;
    if (dl) {
      try { await dl.save({ filename, data: r.blob }); setStatus(`已儲存 ${filename}（${size}）`); return; }
      catch (e) {
        if (e && e.code === 'declined') { setStatus('已取消儲存。'); return; }
        if (e && e.code === 'rate_limited') { setStatus('儲存視窗已經開著，請先處理它。'); return; }
      }
    }
    const file = new File([r.blob], filename, { type: 'image/jpeg' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file] }); setStatus(`完成（${size}）`); return; }
      catch (e) { if (e && e.name === 'AbortError') { setStatus('已取消。'); return; } }
    }
    showSheet(r.blob); setStatus(`完成（${size}），長按圖片即可存到相簿。`);
  } catch (e) {
    setStatus('產生圖片時出錯，照片可能太大。試試較小的照片。');
  } finally { updateSaveBar(); }
}
async function view() {
  if (!state.edOk) return;
  try { const r = await result(); showSheet(r.blob); setStatus(`完整解析度 ${r.w} × ${r.h}，長按圖片即可存到相簿。`); }
  catch (e) { setStatus('產生圖片時出錯，照片可能太大。試試較小的照片。'); }
}
let sheetUrl = null;
function showSheet(blob) {
  if (sheetUrl) URL.revokeObjectURL(sheetUrl);
  sheetUrl = URL.createObjectURL(blob); $('sheetImg').src = sheetUrl; $('sheet').hidden = false;
}
$('sheetClose').addEventListener('click', () => { $('sheet').hidden = true; });
$('sheet').addEventListener('click', e => { if (e.target === $('sheet')) $('sheet').hidden = true; });

async function loadFile(file) {
  if (!file) return;
  try {
    setStatus('讀取照片…', true);
    const buf = await file.arrayBuffer();
    let f35 = null; try { f35 = exifFocal35(buf); } catch (e) {}
    await setSource(await blobToImg(file), file.name, f35);
  } catch (e) {
    setStatus('讀不到這張照片。請選 JPG、PNG 或 iPhone 相簿裡的照片。');
  }
}
$('file').addEventListener('change', e => { loadFile(e.target.files[0]); e.target.value = ''; });
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => { e.preventDefault(); const f = e.dataTransfer.files[0]; if (f && f.type.startsWith('image/')) loadFile(f); });
$('crop').addEventListener('change', () => state.det && renderOptions());
$('lines').addEventListener('change', () => state.det && drawOriginal());
$('grid').addEventListener('change', () => document.body.classList.toggle('nogrid', !$('grid').checked));
$('saveBtn').addEventListener('click', save);
$('viewBtn').addEventListener('click', view);

(async () => {
  setStatus('載入範例…', true);
  try {
    const r = await fetch('sample.jpg'); if (!r.ok) throw new Error('sample');
    await setSource(await blobToImg(await r.blob()), '範例照片（按「選擇照片」換成你的）', null);
  } catch (e) { setStatus('按「選擇照片」開始。'); }
})();
})();
</script>
