<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="上傳照片，自動偵測直線並產生水平、垂直、完整三種拉直結果，可再微調後存回手機。">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="我最正直">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="icon" type="image/png" sizes="180x180" href="apple-touch-icon.png?v=18c8c7a4">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=18c8c7a4">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>我最正直</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: black darkroom. Pixel title spans the full width with the upload button floating at its centre. Three results side by side (always a row of three),
   original + detection facts beside (desktop) or below (phone). Tapping a result opens a full-screen editor: rotation above the photo, keystone right, aspect left, horizontal perspective below, view/save in the photo corners. */
:root{
  --bg:#000000; --surface:#111311; --ink:#EDEFEC; --muted:#8E948D; --line:#262A26;
  --neon:#39FF14; --neon-ink:#000000; --pink:#FF2BD6; --warm:#FF9F43; --white:#FFFFFF; --chip:rgba(0,0,0,.62);
  --grid:rgba(255,255,255,.5); --grid-shadow:rgba(0,0,0,.4); --scrim:rgba(0,0,0,.75);
  --font-pixel:"DotGothic16","Noto Sans TC",monospace;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--font-body);font-size:15px;line-height:1.6}
body.locked{overflow:hidden}
.wrap{max-width:1360px;margin:0 auto;padding-block:20px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:20px}
.top{position:relative;container-type:inline-size;margin-bottom:28px}
.top .pickbtn{position:absolute;left:50%;top:calc(100% + .85cqw);transform:translate(-50%,-50%);transition:transform .18s ease,background-color .18s ease,border-color .18s ease;
  border:3px solid var(--neon-ink);box-shadow:0 4px 18px rgba(0,0,0,.5);z-index:1}
.top .pickbtn:hover,.top .pickbtn.pressed{transform:translate(-50%,-50%) scale(1.15);background:var(--white)}
@media (prefers-reduced-motion: reduce){.top .pickbtn{transition:none}}
h1{font-family:var(--font-pixel);font-weight:700;color:var(--neon);margin:0;line-height:1;letter-spacing:0;white-space:nowrap;text-align:center;
  font-size:calc((100vw - 32px) * .2);font-size:20cqw;text-shadow:0 0 18px rgba(57,255,20,.35)}
h2{font-size:14px;margin:0;font-weight:500;color:var(--muted)}
.btn{font:inherit;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  padding:10px 18px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px}
.btn.primary{background:var(--neon);color:var(--neon-ink);border-color:var(--neon);font-weight:700}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.opt:focus-visible,input[type=range]:focus-visible{outline:2px solid var(--neon);outline-offset:2px}
.status{margin:0;min-height:1.6em;color:var(--muted);font-size:14px;text-align:center}
.status.busy::before{content:"";display:inline-block;width:10px;height:10px;margin-right:8px;border-radius:50%;
  border:2px solid var(--neon);border-right-color:transparent;animation:spin .8s linear infinite;vertical-align:-1px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.status.busy::before{animation:none}}
.content{display:flex;flex-direction:column;gap:28px}
.results{display:flex;flex-direction:column;gap:10px;min-width:0}
.options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:start}
.opt{font:inherit;color:inherit;text-align:left;display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);
  border-radius:10px;padding:6px 6px 10px;cursor:pointer;min-width:0}
.opt:hover{border-color:var(--neon)}
.opt:disabled{cursor:default;border-color:var(--line)}
.opt-name{font-weight:700;font-size:14px;padding-inline:2px}
.opt-info{margin:0;font-family:var(--font-mono);font-size:12px;line-height:1.5;color:var(--muted);font-variant-numeric:tabular-nums;padding-inline:2px}
.opt-info span{display:block}
.frame{position:relative;display:inline-block;max-width:100%;line-height:0;border-radius:6px;overflow:hidden;background:var(--line)}
.frame canvas{display:block;max-width:100%;height:auto}
.opt .frame{display:block}
.opt canvas{width:100%}
.nopreview{padding:30px 6px;line-height:1.5;text-align:center;font-size:13px;color:var(--muted)}
.gridov{position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(to right,var(--grid) 1px,transparent 1px),linear-gradient(to bottom,var(--grid) 1px,transparent 1px);
  background-size:12.5% 12.5%;filter:drop-shadow(0 0 .5px var(--grid-shadow))}
.nogrid .gridov{display:none}
.orig{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:flex-start}
#origCanvas{max-height:min(40vh,340px);width:auto}
.frame .overlay{position:absolute;inset:0;width:100%!important;height:100%!important;max-height:none!important;pointer-events:none}
.facts{margin:0;display:grid;grid-template-columns:auto auto;gap:4px 16px;font-size:14px;min-width:0}
.facts dt{color:var(--muted)}
.facts dd{margin:0;font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.empty{color:var(--muted);margin:0;grid-column:1/-1}

.editor{position:fixed;inset:0;z-index:5;background:var(--bg);overflow:auto;display:flex;flex-direction:column;
  padding-top:calc(12px + env(safe-area-inset-top,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.editor[hidden]{display:none}
.ed-top{display:flex;align-items:center;gap:12px;padding-bottom:10px;max-width:1100px;width:100%;margin:0 auto}
.ed-title{font-weight:700;color:var(--neon)}
.stage{flex:1;display:grid;grid-template-columns:44px minmax(0,1fr) 44px;grid-template-rows:auto minmax(0,1fr) auto;gap:10px;
  grid-template-areas:". top ." "left view right" ". bottom .";max-width:1100px;width:100%;margin:0 auto;
  padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.ed-view{grid-area:view;display:flex;justify-content:center;align-items:center;min-width:0;min-height:0}
.ed-view .frame canvas{max-height:calc(100vh - 230px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
  max-height:calc(100dvh - 230px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));width:auto}
.corner{position:absolute;bottom:10px;z-index:1;min-height:36px;padding:6px 14px;font-size:14px;line-height:1.4}
.corner.bl{left:10px;background:var(--chip);border-color:transparent;color:var(--white)}
.corner.br{right:10px}
.corner.shake{animation:shake .5s ease}
@keyframes shake{0%,100%{translate:0}15%,55%{translate:-7px 0}35%,75%{translate:7px 0}90%{translate:-3px 0}}
@media (prefers-reduced-motion: reduce){.corner.shake{animation:none}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:12;max-width:calc(100% - 32px);
  background:var(--white);color:var(--neon-ink);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:500;text-align:center}
.toast[hidden]{display:none}
.sl{font-size:12px;color:var(--muted)}
.sl output{font-family:var(--font-mono);font-variant-numeric:tabular-nums;color:var(--ink)}
.sl input{accent-color:var(--neon);margin:0}
.hsl{display:flex;flex-direction:column;gap:2px;min-width:0}
.hsl label{display:flex;justify-content:center;gap:8px;font-size:13px;color:var(--ink)}
.hrow{display:flex;align-items:center;gap:8px}
.hrow input{flex:1;min-width:0}
.s-top{grid-area:top}
.s-bottom{grid-area:bottom}
.vsl{display:flex;flex-direction:column;align-items:center;gap:4px;min-height:0;text-align:center;line-height:1.3}
.vsl input{writing-mode:vertical-lr;direction:rtl;flex:1;min-height:100px;width:28px}
.vsl label{color:var(--ink);font-size:12px}
.s-left{grid-area:left}
.s-right{grid-area:right}
.ed-top .btn{padding:6px 14px;min-height:38px;white-space:nowrap;flex-shrink:0}
.ed-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ed-top .outsize{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
.ed-top .outsize b{font-family:var(--font-mono);font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
.sheet{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;z-index:10;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet[hidden]{display:none}
.sheet-card{background:var(--surface);border-radius:12px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:12px;max-width:min(720px,100%);max-height:100%}
.sheet-card p{margin:0;text-align:center}
.sheet-card canvas{min-height:0;max-height:70vh;max-width:100%;width:auto;height:auto;border-radius:6px;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.sheet-card img{min-height:0;object-fit:contain;max-height:70vh;border-radius:6px;-webkit-touch-callout:default}
@media (min-width:1000px){
  .content{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:36px;align-items:start}
  .orig{flex-direction:column}
  .opt-info{font-size:13px}
  .opt-info span{display:inline}
  .opt-info span+span::before{content:" · "}
}
</style>

<main class="wrap">
  <div class="top">
    <h1><span id="titleText">我最 正直</span></h1>
    <label class="btn primary pickbtn" for="file">選擇照片</label>
    <input id="file" type="file" accept="image/*" hidden>
  </div>

  <p id="status" class="status" role="status"></p>

  <div class="content">
    <section class="results">
      <h2>點一張照片放大微調</h2>
      <div class="options" id="options"></div>
    </section>
    <section class="orig">
      <div>
        <div class="frame"><canvas id="origCanvas"></canvas><canvas id="lineCanvas" class="overlay"></canvas></div>
      </div>
      <dl class="facts" id="facts"></dl>
    </section>
  </div>
</main>

<div id="editor" class="editor" hidden role="dialog" aria-labelledby="edName">
  <div class="ed-top">
    <button id="edClose" class="btn" type="button">← 返回</button>
    <span id="edName" class="ed-title"></span>
    <span class="outsize" title="輸出尺寸"><b id="outSize">–</b></span>
    <button id="resetAdj" class="btn" type="button">重設</button>
  </div>
  <div class="stage">
    <div class="sl hsl s-top"><label for="adjRot">旋轉 <output id="outRot">0.0°</output></label>
      <div class="hrow"><span>逆時針</span><input type="range" id="adjRot" min="-10" max="10" step="0.1" value="0"><span>順時針</span></div></div>
    <div class="sl vsl s-left"><span>變高</span><input type="range" id="adjAspect" min="-30" max="30" step="1" value="0"><span>變寬</span>
      <label for="adjAspect">長寬比</label><output id="outAspect">0%</output></div>
    <div class="ed-view"><div class="frame"><canvas id="edCanvas"></canvas><div class="gridov"></div>
      <button id="viewBtn" class="btn corner bl" type="button">看原圖</button><button id="saveBtn" class="btn primary corner br" type="button">存下來</button></div></div>
    <div class="sl vsl s-right"><span>上窄</span><input type="range" id="adjKey" min="-25" max="25" step="1" value="0"><span>上寬</span>
      <label for="adjKey">梯形校正</label><output id="outKey">0%</output></div>
    <div class="sl hsl s-bottom"><label for="adjHorz">水平透視 <output id="outHorz">0.0°</output></label>
      <div class="hrow"><span>左寬</span><input type="range" id="adjHorz" min="-25" max="25" step="0.5" value="0"><span>右寬</span></div></div>
  </div>
</div>

<div id="toast" class="toast" role="status" hidden></div>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-card">
    <p id="sheetText"></p>
    <img id="sheetImg" alt="拉直後的照片">
    <canvas id="sheetCanvas" aria-label="調整前的原始照片"></canvas>
    <button id="sheetClose" class="btn" type="button">關閉</button>
  </div>
</div>

<script>
(() => {
const $ = id => document.getElementById(id);
const DEG = 180 / Math.PI;
const EX = [1, 0, 0], EY = [0, 1, 0];
const DEFAULT_F35 = 26;          // typical phone main camera, 35mm-equivalent
const ANALYZE_LONG = 1024;       // detection resolution
const PREVIEW_LONG = 900;        // option thumbnails
const MAX_AREA = 16e6;           // iOS Safari canvas limit

// ---------- small linear algebra ----------
const dot = (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2];
const cross = (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const norm = a => { const n = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0]/n, a[1]/n, a[2]/n]; };
const mul = (A, B) => A.map(r => [0,1,2].map(j => r[0]*B[0][j] + r[1]*B[1][j] + r[2]*B[2][j]));
const T = A => [[A[0][0],A[1][0],A[2][0]],[A[0][1],A[1][1],A[2][1]],[A[0][2],A[1][2],A[2][2]]];
const mv = (A, v) => [dot(A[0], v), dot(A[1], v), dot(A[2], v)];
const clamp1 = x => Math.max(-1, Math.min(1, x));
const I3 = [[1,0,0],[0,1,0],[0,0,1]];
const Rz = t => { const c = Math.cos(t), s = Math.sin(t); return [[c,-s,0],[s,c,0],[0,0,1]]; };
const Rx = t => { const c = Math.cos(t), s = Math.sin(t); return [[1,0,0],[0,c,-s],[0,s,c]]; };
const Ry = t => { const c = Math.cos(t), s = Math.sin(t); return [[c,0,s],[0,1,0],[-s,0,c]]; };
function axisAngle(k, t) {
  const c = Math.cos(t), s = Math.sin(t), C = 1 - c, [x, y, z] = k;
  return [[c+x*x*C, x*y*C-z*s, x*z*C+y*s], [y*x*C+z*s, c+y*y*C, y*z*C-x*s], [z*x*C-y*s, z*y*C+x*s, c+z*z*C]];
}
// rotation taking unit vector d onto t (optionally only part of the way)
function align(d, t, frac = 1) {
  const ax = cross(d, t), sn = Math.hypot(ax[0], ax[1], ax[2]);
  if (sn < 1e-9) return I3;
  return axisAngle(norm(ax), Math.acos(clamp1(dot(d, t))) * frac);
}
function minEigVec(M) {
  const a = M.map(r => r.slice()), V = [[1,0,0],[0,1,0],[0,0,1]];
  for (let sweep = 0; sweep < 60; sweep++) {
    if (a[0][1]**2 + a[0][2]**2 + a[1][2]**2 < 1e-20) break;
    for (const [p, q] of [[0,1],[0,2],[1,2]]) {
      if (Math.abs(a[p][q]) < 1e-16) continue;
      const th = (a[q][q] - a[p][p]) / (2 * a[p][q]);
      const t = (th >= 0 ? 1 : -1) / (Math.abs(th) + Math.sqrt(th*th + 1));
      const c = 1 / Math.sqrt(t*t + 1), s = t * c;
      for (let k = 0; k < 3; k++) { const x = a[k][p], y = a[k][q]; a[k][p] = c*x - s*y; a[k][q] = s*x + c*y; }
      for (let k = 0; k < 3; k++) { const x = a[p][k], y = a[q][k]; a[p][k] = c*x - s*y; a[q][k] = s*x + c*y; }
      for (let k = 0; k < 3; k++) { const x = V[k][p], y = V[k][q]; V[k][p] = c*x - s*y; V[k][q] = s*x + c*y; }
    }
  }
  let i = 0; for (let k = 1; k < 3; k++) if (a[k][k] < a[i][i]) i = k;
  return [V[0][i], V[1][i], V[2][i]];
}
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---------- EXIF: 35mm-equivalent focal length ----------
function exifFocal35(buf) {
  const v = new DataView(buf);
  if (v.byteLength < 4 || v.getUint16(0) !== 0xFFD8) return null;
  let o = 2;
  while (o < v.byteLength - 10) {
    const m = v.getUint16(o), len = v.getUint16(o + 2);
    if ((m & 0xFF00) !== 0xFF00) return null;
    if (m === 0xFFE1 && v.getUint32(o + 4) === 0x45786966) {
      const t = o + 10, le = v.getUint16(t) === 0x4949;
      const u16 = p => v.getUint16(p, le), u32 = p => v.getUint32(p, le);
      const ifd0 = t + u32(t + 4); let exif = 0;
      for (let i = 0, n = u16(ifd0); i < n; i++) { const e = ifd0 + 2 + i*12; if (u16(e) === 0x8769) exif = t + u32(e + 8); }
      if (!exif) return null;
      for (let i = 0, n = u16(exif); i < n; i++) { const e = exif + 2 + i*12; if (u16(e) === 0xA405) return u16(e + 8) || null; }
      return null;
    }
    o += 2 + len;
  }
  return null;
}

// ---------- line segment detection (region growing on gradient orientation) ----------
function detectSegments(img, w, h) {
  const n = w * h, d = img.data;
  let g = new Float32Array(n), tmp = new Float32Array(n);
  for (let i = 0, p = 0; i < n; i++, p += 4) g[i] = 0.299*d[p] + 0.587*d[p+1] + 0.114*d[p+2];
  const K = [1/16, 4/16, 6/16, 4/16, 1/16];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { let s = 0;
    for (let k = -2; k <= 2; k++) s += K[k+2] * g[y*w + Math.min(w-1, Math.max(0, x+k))]; tmp[y*w+x] = s; }
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { let s = 0;
    for (let k = -2; k <= 2; k++) s += K[k+2] * tmp[Math.min(h-1, Math.max(0, y+k))*w + x]; g[y*w+x] = s; }
  const mag = new Float32Array(n), ang = new Float32Array(n);
  for (let y = 1; y < h-1; y++) for (let x = 1; x < w-1; x++) {
    const i = y*w + x;
    const gx = (g[i-w+1] + 2*g[i+1] + g[i+w+1]) - (g[i-w-1] + 2*g[i-1] + g[i+w-1]);
    const gy = (g[i+w-1] + 2*g[i+w] + g[i+w+1]) - (g[i-w-1] + 2*g[i-w] + g[i-w+1]);
    mag[i] = Math.hypot(gx, gy); ang[i] = Math.atan2(gx, -gy);
  }
  const TH = 36, BINS = 1024, cnt = new Int32Array(BINS + 1);
  const bin = m => Math.min(BINS - 1, (m * 0.7) | 0);
  let total = 0;
  for (let i = 0; i < n; i++) if (mag[i] > TH) { cnt[bin(mag[i])]++; total++; }
  for (let b = BINS - 1, acc = 0; b >= 0; b--) { const c = cnt[b]; cnt[b] = acc; acc += c; }
  const order = new Int32Array(total);
  for (let i = 0; i < n; i++) if (mag[i] > TH) order[cnt[bin(mag[i])]++] = i;

  const used = new Uint8Array(n), reg = new Int32Array(n), tau = Math.PI / 8;
  const diag = Math.hypot(w, h), minLen = Math.max(18, 0.025 * diag), segs = [];
  for (let oi = 0; oi < total; oi++) {
    const seed = order[oi]; if (used[seed]) continue;
    let len = 0, head = 0, th = ang[seed], sx = Math.cos(th), sy = Math.sin(th);
    used[seed] = 1; reg[len++] = seed;
    while (head < len) {

    if ($('editor').hidden) return;
    const p = currentParams(), cv = $('edCanvas'), s = state.small;
    const out = p && renderWarp(state.smallData, s.width, s.height, state.fNorm, p.R, p.crop, PREVIEW_LONG, p.post);
    state.edOk = !!out;
    if (out) {
      cv.width = out.width; cv.height = out.height; cv.getContext('2d').drawImage(out, 0, 0);
      const f = state.full, pl = plan(f.width, f.height, state.fNorm, p.R, p.crop, Math.max(f.width, f.height), p.post);
      $('outSize').textContent = pl ? `${pl.ow}×${pl.oh}` : '–';
    } else $('outSize').textContent = '角度太大';
    updateSaveBar(); prewarm();
  });
}
for (const [k, id, out, f] of SLIDERS) {
  $(id).addEventListener('input', () => { adj[k] = +$(id).value; $(out).textContent = f(adj[k]); renderEditor(); });
  $(id).addEventListener('dblclick', () => { adj[k] = 0; $(id).value = 0; $(out).textContent = f(0); renderEditor(); });
}
$('resetAdj').addEventListener('click', resetAdj);

function updateSaveBar() {
  $('saveBtn').disabled = $('viewBtn').disabled = !state.edOk;
}

// Full-resolution result for the current settings, cached so a later tap can share it right away.
const blobCache = new Map();
function fullBlob() {
  const p = currentParams(); if (!p) return Promise.reject(new Error('none'));
  if (!blobCache.has(p.key)) {
    blobCache.clear();
    blobCache.set(p.key, (async () => {
      const f = state.full, src = f.getContext('2d').getImageData(0, 0, f.width, f.height).data;
      const cv = renderWarp(src, f.width, f.height, state.fNorm, p.R, p.crop, Math.max(f.width, f.height), p.post);
      if (!cv) throw new Error('range');
      const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.92));
      if (!blob) throw new Error('encode');
      return { blob, w: cv.width, h: cv.height };
    })().catch(e => { blobCache.delete(p.key); throw e; }));
  }
  return blobCache.get(p.key);
}
// Outside Claude (the GitHub Pages copy) saving goes through the share sheet, which needs the file ready at tap time.
let prewarmTimer = 0;
function prewarm() {
  if (window.claude || !navigator.canShare) return;
  clearTimeout(prewarmTimer);
  prewarmTimer = setTimeout(() => { if (state.edOk && !state.isSample) fullBlob().catch(() => {}); }, 800);
}
async function result() {
  const p = currentParams();
  if (p && !blobCache.has(p.key)) { setStatus('以完整解析度產生中…', true); await tick(); }
  return fullBlob();
}

async function save() {
  if (!state.edOk) return;
  if (state.isSample) {
    const b = $('saveBtn'); b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake');
    toast('欸你幹嘛偷拿啦'); return;
  }
  $('saveBtn').disabled = true;
  try {
    const r = await result(), size = `${r.w} × ${r.h}`;
    const base = state.name.replace(/\.[^.]+$/, '').replace(/[^\w一-鿿-]+/g, '_') || 'photo';
    const filename = `${base}-straight.jpg`;
    const dl = await downloadsP;
    if (dl) {
      try { await dl.save({ filename, data: r.blob }); setStatus(`已儲存 ${filename}（${size}）`); return; }
      catch (e) {
        if (e && e.code === 'declined') { setStatus('已取消儲存。'); return; }
        if (e && e.code === 'rate_limited') { setStatus('儲存視窗已經開著，請先處理它。'); return; }
      }
    }
    const file = new File([r.blob], filename, { type: 'image/jpeg' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file] }); setStatus(`完成（${size}）`); return; }
      catch (e) { if (e && e.name === 'AbortError') { setStatus('已取消。'); return; } }
    }
    showSheet(r.blob); setStatus('');
  } catch (e) {
    setStatus('產生圖片時出錯，照片可能太大。試試較小的照片。');
  } finally { updateSaveBar(); }
}
function view() {
  const s = state.small, c = $('sheetCanvas');
  c.width = s.width; c.height = s.height; c.getContext('2d').drawImage(s, 0, 0);
  $('sheetText').textContent = '調整前的原始照片';
  $('sheetImg').hidden = true; c.hidden = false; $('sheet').hidden = false;
}
let sheetUrl = null;
function showSheet(blob) {
  if (sheetUrl) URL.revokeObjectURL(sheetUrl);
  sheetUrl = URL.createObjectURL(blob); $('sheetImg').src = sheetUrl;
  $('sheetText').textContent = '長按圖片，選「加入照片」或「儲存影像」。電腦上可按右鍵另存。';
  $('sheetCanvas').hidden = true; $('sheetImg').hidden = false; $('sheet').hidden = false;
}
let toastTimer = 0;
function toast(t) { const el = $('toast'); el.textContent = t; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 2600); }
$('sheetClose').addEventListener('click', () => { $('sheet').hidden = true; });
$('sheet').addEventListener('click', e => { if (e.target === $('sheet')) $('sheet').hidden = true; });

async function loadFile(file) {
  if (!file) return;
  try {
    setStatus('讀取照片…', true);
    const buf = await file.arrayBuffer();
    let f35 = null; try { f35 = exifFocal35(buf); } catch (e) {}
    await setSource(await blobToImg(file), file.name, f35);
  } catch (e) {
    setStatus('讀不到這張照片。請選 JPG、PNG 或 iPhone 相簿裡的照片。');
  }
}
$('file').addEventListener('change', e => { loadFile(e.target.files[0]); e.target.value = ''; });
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => { e.preventDefault(); const f = e.dataTransfer.files[0]; if (f && f.type.startsWith('image/')) loadFile(f); });
$('saveBtn').addEventListener('click', save);
$('viewBtn').addEventListener('click', view);
$('saveBtn').addEventListener('animationend', () => $('saveBtn').classList.remove('shake'));
// Size the title so its glyphs span the header exactly, whatever the font's space width.
function fitTitle() {
  const t = $('titleText'), box = t.closest('.top'), cs = getComputedStyle(box);
  const avail = box.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  t.parentElement.style.fontSize = '100px';
  const w = t.getBoundingClientRect().width;
  if (w > 0 && avail > 0) t.parentElement.style.fontSize = `${Math.floor(100 * avail / w * 100) / 100}px`;
}
fitTitle();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitTitle);
if (window.ResizeObserver) new ResizeObserver(fitTitle).observe(document.querySelector('.top'));
const pick = document.querySelector('.pickbtn');
pick.addEventListener('pointerdown', () => { pick.classList.add('pressed'); setTimeout(() => pick.classList.remove('pressed'), 300); });

(async () => {
  setStatus('載入範例…', true);
  try {
    const r = await fetch('sample.jpg'); if (!r.ok) throw new Error('sample');
    await setSource(await blobToImg(await r.blob()), '範例照片', null, true);
  } catch (e) { setStatus('按「選擇照片」開始。'); }
})();
})();
</script>
